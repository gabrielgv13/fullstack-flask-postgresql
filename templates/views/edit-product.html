{% extends 'dashboard.html' %}

{% block header %}
  <h1>{% block title %}Dashboard{% endblock %}</h1>
{% endblock %}

{% block dash-view %}
  <h1>Editar Produto</h1>
  <form method="post">
    <label for="name">Nome</label>
    <input name="name" id="name" value="{{ product.name }}" required>

    <label for="barcode">Código de Barras</label>
    <input name="barcode" id="barcode" value="{{ product.barcode }}">

    <label for="category">Categoria</label>
    <input name="category" id="category" value="{{ product.category }}">

    <label for="price">Preço</label>
    <input type="number" step="0.01" min="0" name="price" id="price" value="{{ product.price }}" required>

    <label for="stock">Quantidade em Estoque</label>
    <input type="number" min="0" name="stock" id="stock" value="{{ product.stock }}" required>

    <input type="submit" value="Salvar">
  </form>
{% endblock %}
